<!doctype html>
<meta charset="utf-8" />
<title>music fade-in test</title>
<body style="font:13px/1.5 system-ui;background:#0b1a3a;color:#dbe6ff;padding:20px">
  <p>Click Run. The button click is the user gesture the AudioContext needs, so the
     test exercises the real (post-gesture) graph path, not the fallback.</p>
  <button id="go" style="font:14px system-ui;padding:10px 18px;border-radius:8px">Run</button>
  <pre id="out" style="white-space:pre-wrap"></pre>
  <script type="module">
    import { MusicEngine, primeAudio } from '/src/focus/music.ts';
    import { armAudioContext, audioCtx } from '/src/focus/timer.ts';

    /** A 6-second sine as a WAV data URI, so the suite needs no asset and the fade
     *  multiplier is the only thing shaping the level. */
    function toneWav(seconds = 6, freq = 220, rate = 8000) {
      const n = seconds * rate;
      const buf = new ArrayBuffer(44 + n * 2);
      const v = new DataView(buf);
      const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin((2 * Math.PI * freq * i) / rate) * 32000, true);
      const b = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return 'data:audio/wav;base64,' + btoa(s);
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    document.getElementById('go').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'running…';
      const src = toneWav();
      const T = (k) => ({ key: k, label: k, emoji: 'M', src, volume: 100, gain: 1 });
      const R = [];
      const ok = (name, cond, extra = '') => R.push(`${cond ? 'PASS' : 'FAIL'}  ${name} ${extra}`);
      try {
        armAudioContext();
        await wait(120);

        // --- A. the curve, sampled at fixed instants: one engine per reading, so a
        //        slow sample can't smear the next one.
        //
        //        The bands are wide on purpose. setTimeout is clamped to about a
        //        second whenever this page is hidden or backgrounded, so a "120ms"
        //        sleep can land anywhere up to ~1s — a narrow band would fail on the
        //        harness clock, not on the code. What is actually being asserted here
        //        is the SHAPE: silent at zero, clearly under way early, still short of
        //        full past the midpoint. Run this tab visible for tight readings. ---
        for (const [ms, lo, hi] of [[0, -0.001, 0.001], [120, 0.05, 0.6], [300, 0.15, 0.7], [1200, 0.4, 0.95]]) {
          const e = new MusicEngine();
          e.setVolume(100);
          e.setPlaylist([T('a')], 0, true);
          await wait(ms);
          const f = e['fadeMul'];
          ok(`A level at ${ms}ms in [${lo}, ${hi}]`, f >= lo && f <= hi, `= ${f.toFixed(3)}`);
          if (ms === 0) ok('A graph route active', e['graph'] !== null, `ctx=${audioCtx()?.state}`);
          e.pause();
        }

        // --- B. it reaches full, and the output gain follows it all the way ---
        const e1 = new MusicEngine();
        e1.setVolume(100);
        e1.setPlaylist([T('a'), T('b')], 0, true);
        await wait(600); const g600 = e1['graph'].gain.gain.value;
        await wait(1200); const g1800 = e1['graph'].gain.gain.value;
        await wait(1100);
        ok('B reaches full', e1['fadeMul'] > 0.995, `= ${e1['fadeMul'].toFixed(3)}`);
        ok('B output gain rises with it', g600 < g1800 && g1800 < e1['graph'].gain.gain.value, `${g600.toFixed(2)} < ${g1800.toFixed(2)} < ${e1['graph'].gain.gain.value.toFixed(2)}`);
        ok('B lands on the real target (MAX_GAIN at 100%)', Math.abs(e1['graph'].gain.gain.value - 2) < 0.02, `= ${e1['graph'].gain.gain.value.toFixed(3)}`);

        // --- C. a track change re-fades ---
        e1.next();
        await wait(120);
        ok('C next() re-arms the fade', e1['fadeMul'] < 0.6, `= ${e1['fadeMul'].toFixed(3)}`);
        await wait(2900);
        ok('C the new track reaches full', e1['fadeMul'] > 0.995, `= ${e1['fadeMul'].toFixed(3)}`);
        e1.pause();

        // --- D. the volume slider and the fade compose, never overwrite ---
        const e2 = new MusicEngine();
        e2.setVolume(100);
        e2.setPlaylist([T('a')], 0, true);
        await wait(600);
        const mid = e2['fadeMul'];
        e2.setVolume(40);
        await wait(500);
        ok('D fade survives a volume change', e2['fadeMul'] > mid, `${mid.toFixed(3)} -> ${e2['fadeMul'].toFixed(3)}`);
        await wait(2100);
        ok('D fade still completes', e2['fadeMul'] > 0.995, `= ${e2['fadeMul'].toFixed(3)}`);
        ok('D new volume honored', Math.abs(e2['graph'].gain.gain.value - Math.pow(0.4, 2.2) * 2) < 0.01, `= ${e2['graph'].gain.gain.value.toFixed(4)}`);

        // --- E. pause holds, resume swells quickly ---
        const held = e2['fadeMul'];
        e2.pause();
        await wait(200);
        ok('E pause holds the level', Math.abs(e2['fadeMul'] - held) < 0.001, `= ${e2['fadeMul'].toFixed(3)}`);
        e2.play();
        await wait(70);
        ok('E resume dips', e2['fadeMul'] < 0.98, `= ${e2['fadeMul'].toFixed(3)}`);
        await wait(600);
        ok('E resume fade done under 700ms', e2['fadeMul'] > 0.995, `= ${e2['fadeMul'].toFixed(3)}`);
        e2.pause();

        // --- F. prewarming never throws and ignores repeats ---
        let threw = false;
        try { primeAudio(null); primeAudio(undefined); primeAudio(src); primeAudio(src); } catch { threw = true; }
        ok('F primeAudio safe and idempotent', !threw);
      } catch (e) {
        R.push('FAIL  suite threw: ' + e.message);
      }
      const pass = R.filter((r) => r.startsWith('PASS')).length;
      window.__fade = { pass, fail: R.length - pass, total: R.length, results: R };
      out.textContent = R.join('\n') + `\n\n${pass}/${R.length} passed`;
    });
  </script>
</body>
