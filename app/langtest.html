<!doctype html>
<meta charset="utf-8" />
<title>languages test</title>
<link rel="stylesheet" href="/src/ui/settings.css" />
<body style="font:13px/1.6 system-ui;background:#0b1a3a;color:#dbe6ff;padding:20px">
  <pre id="out">running…</pre>
  <h3 style="margin-top:26px">Rendered picker (styling check)</h3>
  <div id="demo" style="max-width:520px"></div>
  <script type="module">
    import { LANGUAGES, DEFAULT_TRANSLATE_FROM, findLanguage, languageLabel, expandCodes, searchLanguages } from '/src/util/languages.ts';
    import { normalizePrefs, DEFAULT_PREFS, setPrefsCache } from '/src/prefs.ts';
    import { analyzeTitle, resetTranslationCache } from '/src/util/translate.ts';
    import { TasksView } from '/src/tasks/render.ts';

    const R = [];
    const ok = (name, cond, extra = '') => R.push(`${cond ? 'PASS' : 'FAIL'}  ${name} ${extra}`);
    const eq = (name, got, want) => ok(name, JSON.stringify(got) === JSON.stringify(want), `got ${JSON.stringify(got)}`);

    // --- catalog ---
    eq('defaults are Hebrew, Spanish, Arabic, French', DEFAULT_TRANSLATE_FROM, ['he', 'es', 'ar', 'fr']);
    ok('the catalog is the full detectable set, not a short list', LANGUAGES.length >= 100, `${LANGUAGES.length} languages`);
    ok('every default resolves in the catalog', DEFAULT_TRANSLATE_FROM.every((c) => !!findLanguage(c)));
    ok('the four defaults come first', LANGUAGES.slice(0, 4).map((l) => l.code).join(',') === 'he,es,ar,fr');
    ok('the rest are alphabetical by English name', (() => {
      const rest = LANGUAGES.slice(4).map((l) => l.label);
      return rest.every((n, i) => i === 0 || rest[i - 1].localeCompare(n) <= 0);
    })());
    ok('no duplicate codes', new Set(LANGUAGES.map((l) => l.code)).size === LANGUAGES.length);
    ok('every entry has a native name', LANGUAGES.every((l) => !!l.native && !!l.label));
    ok('the languages Gabe named are all present', ['pt', 'sw', 'ru', 'de', 'zh', 'ja', 'ko', 'la', 'yi', 'it'].every((c) => !!findLanguage(c)));
    eq("'iw' still resolves to Hebrew", findLanguage('iw')?.code, 'he');
    eq("'zh-CN' resolves to Chinese", findLanguage('zh-CN')?.code, 'zh');
    eq("'jw' resolves to Javanese", findLanguage('jw')?.code, 'jv');
    eq('label for a detected code', languageLabel('iw'), 'Hebrew');
    eq('label for an unknown code falls back', languageLabel('qq'), 'QQ');

    // --- alias expansion: picking Hebrew must also match what Google actually says ---
    const he = expandCodes(['he']);
    ok("expandCodes('he') covers 'iw'", he.has('he') && he.has('iw'), [...he].join(','));
    ok('expandCodes honors an unknown code literally', expandCodes(['qq']).has('qq'));
    ok('expandCodes([]) is empty', expandCodes([]).size === 0);

    // --- search ---
    ok('search by English name', searchLanguages('portu').some((l) => l.code === 'pt'));
    ok('search by native name', searchLanguages('עברית').some((l) => l.code === 'he'));
    ok('search by code', searchLanguages('sw').some((l) => l.code === 'sw'));
    ok('search is case-insensitive', searchLanguages('HEBREW').some((l) => l.code === 'he'));
    ok('empty query returns the whole catalog', searchLanguages('  ').length === LANGUAGES.length);
    ok('nonsense query returns nothing', searchLanguages('zzzzz').length === 0);

    // --- prefs normalization ---
    eq('absent key falls back to the defaults', normalizePrefs({}).tasks.translateFrom, ['he', 'es', 'ar', 'fr']);
    eq('an EMPTY array is a real choice, not a missing one', normalizePrefs({ tasks: { translateFrom: [] } }).tasks.translateFrom, []);
    eq('a saved list survives', normalizePrefs({ tasks: { translateFrom: ['he', 'ru'] } }).tasks.translateFrom, ['he', 'ru']);
    eq('junk entries are dropped', normalizePrefs({ tasks: { translateFrom: ['he', 42, '', null, 'RU'] } }).tasks.translateFrom, ['he', 'ru']);
    eq('a non-array is ignored', normalizePrefs({ tasks: { translateFrom: 'he' } }).tasks.translateFrom, ['he', 'es', 'ar', 'fr']);
    ok('normalize does NOT hand back the defaults array by reference',
      normalizePrefs({}).tasks.translateFrom !== DEFAULT_PREFS.tasks.translateFrom);

    // --- the gate ---
    //
    // Driven by a STUBBED fetch, so the suite is deterministic and runs anywhere,
    // including the sandboxed browser this is verified in (no outbound network).
    // Canned MyMemory responses, captured from the live API on 8/15. Shape:
    //   { responseStatus, responseData: { translatedText, detectedLanguage } }
    // English input really does come back as a 403 "PLEASE SELECT TWO DISTINCT
    // LANGUAGES", and the junk words really do come back UNCHANGED — both verified
    // against the real endpoint, which is what the gate now leans on.
    const CANNED = {
      'שיעורי בית בדקדוק': ['Grammar homework', 'he'],
      'tarea de matemáticas': ['math homework', 'es'],
      'O homem está usando um chapéu onipresente.': ['The man is wearing an omnipresent hat.', 'pt'],
      // Detection returning NOTHING is the only case the fallback covers now — a
      // NAMED language, even a wrong one, is treated as an answer (see analyzeTitle).
      'Korýtnačka porazila zajaca': ['Korýtnačka porazila zajaca', ''],   // no detection
      'Domáca úloha z matematiky': ['Domáca úloha z matematiky', ''],     // no detection
      // …and a title the provider DOES name, off the student's list, is left alone
      // even though its script matches something they enabled. This is the CJK bug.
      '第七章': ['Chapter Seven', 'zh'],
      'Som v pohode': ["I'm fine", 'sk'],                                  // short: detected correctly
      huu: ['huu', 'fr'],           // unchanged → not a translation
      heybo: ['heybo', 'es'],       // unchanged → not a translation
      asdf: ['asdf', 'es'],         // unchanged → not a translation
      tarea: ['task', 'es'],        // one word, but genuinely translated
      'chapitre 3': ['chapter 3', 'fr'],
    };
    // Auto-detect MIS-fires on longer text in closely-related languages, which is the
    // whole reason the explicit fallback exists. Captured live on 8/15: Slovak
    // sentences come back detected as Bosnian/Polish/Malagasy and untranslated, and
    // translate correctly the moment the pair is named. EXPLICIT[lang][text] is what
    // the provider answers when asked by name.
    const EXPLICIT = {
      sk: {
        'Korýtnačka porazila zajaca': 'The turtle defeated the hare',
        'Domáca úloha z matematiky': 'Math homework',
        // What naming a language does to junk — the reason for the word-count guard.
        huu: 'HUU,',
        asdf: 'Eine Liste von Benutzernamen',
      },
      es: { huu: 'HUU,', asdf: 'Eine Liste von Benutzernamen', 'Read Ch. 7 and annotate': 'Read Ch. 7 and note' },
    };
    let quotaOut = false;
    let explicitCalls = 0;
    const realFetch = window.fetch;
    // The pipeline now speaks to the deployed translateTitles Cloud Function, which
    // calls Google Cloud Translation with the project's own credentials. httpsCallable
    // is fetch underneath, so the stub intercepts THAT — the suite stays deterministic
    // and offline while exercising the real code path.
    window.fetch = async (url, init) => {
      const u = String(url && url.url ? url.url : url);
      if (!/cloudfunctions\.net\/translateTitles|\/translateTitles$/.test(u)) {
        throw new Error('translate used an unexpected transport: ' + u);
      }
      const body = JSON.parse((init && init.body) || '{}');
      const texts = (body.data && body.data.texts) || [];
      const from = (body.data && body.data.from) || '';
      if (quotaOut) {
        return new Response(JSON.stringify({ result: { results: texts.map(() => null) } }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      const results = texts.map((q) => {
        if (from) {
          explicitCalls++;
          const tr = (EXPLICIT[from] || {})[q];
          // No entry = the engine had nothing to change, which is what it does for a
          // language the text is not actually in.
          return { tr: tr || q, src: from };
        }
        const hit = CANNED[q];
        // Not canned = Google hands English straight back with `en` detected.
        if (!hit) return { tr: q, src: 'en' };
        return { tr: hit[0], src: hit[1] };
      });
      return new Response(JSON.stringify({ result: { results } }),
        { status: 200, headers: { 'content-type': 'application/json' } });
    };

    const withLangs = async (codes) => {
      const p = structuredClone(DEFAULT_PREFS);
      p.tasks.translateFrom = codes;
      setPrefsCache(p);
      resetTranslationCache();
    };
    try {
      await withLangs([]);
      eq('no languages picked = translation off', (await analyzeTitle('שיעורי בית בדקדוק')).status, 'english');

      await withLangs(['he', 'es', 'ar', 'fr']);
      ok('Hebrew translates on the default list', (await analyzeTitle('שיעורי בית בדקדוק')).status === 'foreign');
      ok('Spanish translates', (await analyzeTitle('tarea de matemáticas')).status === 'foreign');
      ok('a ONE-WORD real translation is kept ("tarea" → "task")', (await analyzeTitle('tarea')).status === 'foreign');
      ok('French translates', (await analyzeTitle('chapitre 3')).status === 'foreign');
      eq('an English title comes back English', (await analyzeTitle('Read Ch. 7 and annotate')).status, 'english');

      // The three that started all of this. None of them is refused by a confidence
      // number any more — they are refused because the translation is the input.
      eq('"huu" stays English: the text came back unchanged', (await analyzeTitle('huu')).status, 'english');
      eq('"heybo" stays English', (await analyzeTitle('heybo')).status, 'english');
      eq('"asdf" stays English', (await analyzeTitle('asdf')).status, 'english');
      // …and it holds even with the detected language deliberately switched ON,
      // which the old confidence gate could not do.
      await withLangs(['fr']);
      eq('"huu" stays English even with French ON', (await analyzeTitle('huu')).status, 'english');
      await withLangs(['es']);
      eq('"heybo" stays English even with Spanish ON', (await analyzeTitle('heybo')).status, 'english');

      eq("Gabe's Portuguese title is untouched while Portuguese is OFF",
        (await analyzeTitle('O homem está usando um chapéu onipresente.')).status, 'english');
      await withLangs(['he', 'es', 'ar', 'fr', 'pt']);
      ok('turning Portuguese ON translates it',
        (await analyzeTitle('O homem está usando um chapéu onipresente.')).status === 'foreign');
      await withLangs(['he', 'es', 'ar', 'fr']);
      eq('turning it back off applies immediately, no reload',
        (await analyzeTitle('O homem está usando um chapéu onipresente.')).status, 'english');

      // Quota / network failures must read as "ask again later", never as English —
      // an 'english' verdict gets STORED on the task and would stick forever.
      // --- the fallback: auto-detect guessed a sibling language, so ask by name ---
      await withLangs(['sk', 'he', 'es', 'fr']);
      explicitCalls = 0;
      const sk1 = await analyzeTitle('Korýtnačka porazila zajaca');
      ok('an UNDETECTED sentence still translates, by asking each language outright',
        sk1.status === 'foreign' && sk1.text === 'The turtle defeated the hare', JSON.stringify(sk1));
      const sk2 = await analyzeTitle('Domáca úloha z matematiky');
      ok('…and so does the other one', sk2.status === 'foreign' && sk2.text === 'Math homework', JSON.stringify(sk2));
      ok('the fallback only runs when the auto pass failed', explicitCalls > 0);

      explicitCalls = 0;
      const sk3 = await analyzeTitle('Som v pohode');
      ok('a correctly-detected sentence never reaches the fallback', sk3.status === 'foreign' && explicitCalls === 0, `${explicitCalls} explicit calls`);

      // GUARD 1: short junk must not be handed to a named engine, which would
      // translate it rather than decline.
      explicitCalls = 0;
      eq('"huu" is still English — too short for the fallback', (await analyzeTitle('huu')).status, 'english');
      eq('"asdf" too', (await analyzeTitle('asdf')).status, 'english');
      ok('…and neither one even asked', explicitCalls === 0, `${explicitCalls} explicit calls`);

      // GUARD 2: a title the provider already called English is never re-asked.
      explicitCalls = 0;
      eq('an English sentence stays English', (await analyzeTitle('Read Ch. 7 and annotate')).status, 'english');
      ok('…and was not re-asked as Spanish (which would have reworded it)', explicitCalls === 0, `${explicitCalls} explicit calls`);

      // THE CJK BUG (Gabe, 8/16). Chinese detected as Chinese, with only Japanese
      // enabled: Han is the one script three languages share, so the old gate let the
      // fallback ask Japanese, and a named engine translates whatever it is handed.
      await withLangs(['ja']);
      eq('Chinese is left alone when only Japanese is on', (await analyzeTitle('第七章')).status, 'english');
      await withLangs(['ko']);
      eq('…and when only Korean is on', (await analyzeTitle('第七章')).status, 'english');
      await withLangs(['zh']);
      ok('but it DOES translate when Chinese is on', (await analyzeTitle('第七章')).status === 'foreign');

      quotaOut = true;
      await withLangs(['he']);
      eq('a provider failure is an error, not a verdict', (await analyzeTitle('שיעורי בית בדקדוק')).status, 'error');
      quotaOut = false;
      ok('and the failure was not cached', (await analyzeTitle('שיעורי בית בדקדוק')).status === 'foreign');
    } catch (e) {
      R.push('FAIL  gate stage threw: ' + e.message);
    }

    // --- END TO END: the picker must change what EXISTING tasks show ---
    //
    // This is the stage that would have caught the bug Gabe reported. The gate above
    // only proves analyzeTitle answers correctly; a task carries `translationChecked`
    // written onto it, so a correct answer never reaches a task that was already
    // judged. Everything here runs against a real TasksView.
    //
    // NOTE for whoever edits this next: it has to live INSIDE this page's module
    // script. Evaluating it from the devtools console loads a SEPARATE copy of
    // prefs.ts, so setPrefsCache there is invisible to TasksView and every
    // assertion silently reads the wrong list.
    // (the stub installed above is still in place — same shape, same canned answers)
    try {
      const SIG_KEY = 'cobalt:tx-langs';
      const writes = [];
      const view = new TasksView({
        putTasksBulk: async (ts) => {
          writes.push(ts.length);
          for (const t of ts) view.map[t.id] = t;
        },
      });
      const mk = (id, title, checked, translated, lang) => ({
        id, title, completed: false, priority: 'normal', addedAt: '2026-01-01', dueDate: '',
        translationChecked: checked, translatedTitle: translated || '', translatedLang: lang || '',
      });
      const runPass = () => view.autoTranslatePass();
      const setLangs = async (codes) => { await withLangs(codes); };

      // The starting state Gabe actually had: a Portuguese task already judged
      // English (Portuguese was off), and a "huu" task carrying a translation from
      // before the picker existed.
      localStorage.setItem(SIG_KEY, 'he,es,ar,fr');
      await setLangs(['he', 'es', 'ar', 'fr']);
      view.map = {
        p1: mk('p1', 'O homem está usando um chapéu onipresente.', true, '', ''),
        h1: mk('h1', 'huu', true, 'this one', 'sw'),
      };
      writes.length = 0;
      await runPass();
      ok('an unchanged list writes nothing', writes.length === 0, `${writes.length} writes`);

      await setLangs(['he', 'es', 'ar', 'fr', 'pt']);
      await runPass();
      ok('turning a language on clears every stored verdict', writes.length === 1, `${writes.length} writes`);
      await runPass(); // the re-entry watchTasks causes for real
      ok('the Portuguese task NOW translates',
        view.map.p1.translatedTitle === 'The man is wearing an omnipresent hat.' && view.map.p1.translatedLang === 'pt',
        JSON.stringify(view.map.p1.translatedTitle));
      ok('the stale "huu" translation is gone (Swahili still off)',
        view.map.h1.translatedTitle === '' && view.map.h1.translationChecked === true,
        JSON.stringify(view.map.h1.translatedTitle));

      await setLangs(['he', 'es', 'ar', 'fr']);
      await runPass(); await runPass();
      ok('turning it back OFF removes the translation again', view.map.p1.translatedTitle === '', JSON.stringify(view.map.p1.translatedTitle));

      // "huu" now stays clean no matter what is enabled, because the provider hands
      // the word back unchanged. Turning its detected language on cannot resurrect
      // the bogus translation — which the old confidence gate could not promise.
      await setLangs(['fr']);
      await runPass(); await runPass();
      ok('"huu" stays clean even with its detected language ON', view.map.h1.translatedTitle === '', JSON.stringify(view.map.h1.translatedTitle));

      // A real one-word translation still comes through.
      view.map.t1 = mk('t1', 'tarea', false, '', '');
      await setLangs(['es']);
      await runPass(); await runPass();
      ok('a one-word REAL translation lands', view.map.t1.translatedTitle === 'task', JSON.stringify(view.map.t1.translatedTitle));

      await setLangs([]);
      await runPass(); await runPass();
      ok('emptying the list clears everything', view.map.t1.translatedTitle === '' && view.map.p1.translatedTitle === '');

      await setLangs(['he']);
      await runPass(); await runPass();
      view.map.n1 = mk('n1', 'שיעורי בית בדקדוק', false, '', '');
      await runPass();
      ok('a brand-new task is translated by the ordinary pass', view.map.n1.translatedTitle === 'Grammar homework', JSON.stringify(view.map.n1.translatedTitle));

      // THE ONE-WAY DOOR: a language changed while the task list has not loaded yet
      // (Settings is its own tab). Recording the signature there would skip the
      // rescan forever, which is the "Portuguese on, still nothing" report.
      localStorage.setItem(SIG_KEY, 'he');
      const empty = new TasksView({ putTasksBulk: async () => { throw new Error('should not write'); } });
      empty.map = {};
      await setLangs(['he', 'pt']);
      await empty.autoTranslatePass();
      ok('an empty task list does NOT burn the signature', localStorage.getItem(SIG_KEY) === 'he', localStorage.getItem(SIG_KEY));
      // …and the same change then lands properly once the tasks are there.
      empty.map = { z1: mk('z1', 'O homem está usando um chapéu onipresente.', true, '', '') };
      empty.data = { putTasksBulk: async (ts) => { for (const t of ts) empty.map[t.id] = t; } };
      await empty.autoTranslatePass();
      await empty.autoTranslatePass();
      ok('the change lands once the tasks load', empty.map.z1.translatedTitle === 'The man is wearing an omnipresent hat.', JSON.stringify(empty.map.z1.translatedTitle));

      await setLangs(['he']);
      view.map = { k1: mk('k1', 'x', true, '', '') };
      await runPass(); // clears (the list just changed)
      await runPass(); // re-reads the cleared task
      ok('the signature is persisted', localStorage.getItem(SIG_KEY) === 'he', localStorage.getItem(SIG_KEY));
      writes.length = 0;
      await runPass();
      ok('a settled list writes nothing on a repeat pass', writes.length === 0, `${writes.length} writes`);
      localStorage.removeItem(SIG_KEY);
    } catch (e) {
      R.push('FAIL  end-to-end stage threw: ' + e.message);
    } finally {
      window.fetch = realFetch;
      await withLangs(DEFAULT_TRANSLATE_FROM);
    }

    const pass = R.filter((r) => r.startsWith('PASS')).length;
    window.__lang = { pass, fail: R.length - pass, total: R.length, results: R };
    document.getElementById('out').textContent = R.join('\n') + `\n\n${pass}/${R.length} passed`;

    // --- a static render of the picker markup, purely to eyeball the CSS ---
    const chips = DEFAULT_TRANSLATE_FROM.map((c) => {
      const l = findLanguage(c);
      return `<span class="lang-chip"><span class="lang-chip-name">${l.label}</span><span class="lang-chip-native">${l.native}</span><button class="lang-chip-x">✕</button></span>`;
    }).join('');
    const results = LANGUAGES.slice(4, 14).map((l) => `<button class="lang-result"><span class="lang-result-name">${l.label}</span><span class="lang-result-native">${l.native}</span></button>`).join('');
    document.getElementById('demo').innerHTML = `
      <div class="settings-group-label">🌐 Languages</div>
      <div class="lang-picker">
        <div class="lang-lead">Titles written in these languages get an English translation. Everything else is left alone.</div>
        <div class="lang-chips">${chips}</div>
        <div class="lang-search" style="position:static">
          <input class="settings-input lang-input" placeholder="Add a language…" />
          <div class="lang-results" style="position:static;margin-top:6px">${results}</div>
        </div>
      </div>`;
  </script>
</body>
