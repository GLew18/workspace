<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cobalt">
  <!-- Cobalt favicon: the BARE gem, no tile (Gabe 8/10 final: bare renders the gem bigger). Transparent behind it. -->
<defs>
    <clipPath id="fg-clip"><rect x="9" y="9" width="82" height="82" rx="31" ry="31"/></clipPath>
    <radialGradient id="fg-body" cx="36%" cy="30%" r="88%">
      <stop offset="0%" stop-color="#8cc0ff"/><stop offset="38%" stop-color="#3d7fe8"/>
      <stop offset="68%" stop-color="#0b46b0"/><stop offset="100%" stop-color="#032154"/>
    </radialGradient>
    <radialGradient id="fg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7db4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7db4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg-sheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
