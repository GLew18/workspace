<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="The best Schoology alternative for Heschel students: assignments, focus, and links in one place." />
    <title>Cobalt</title>
    <!-- Favicon = the cobalt gem (Gabe, 8/10). The monitor tile stays the PWA /
         home-screen icon below; only the browser-tab icon is the gem. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-gem.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-gem-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone "Add to Home Screen": iOS ignores the manifest icons and reads these. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cobalt" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FOUR WEIGHTS, AND THE CSS MAY ONLY ASK FOR THESE FOUR (Gabe, 8/27).
         An @font-face family shadows any same-named system font entirely, so a rule
         asking for a weight that is not in this URL does not fall back to a heavier
         local Inter and does not get synthesised - Chrome silently serves the nearest
         face it has. Fourteen rules across seven stylesheets asked for 800 and had
         been rendering as 700 since the day they were written; measured, "Ready when
         you are" at 40px comes out at exactly 394.136px for 700, 800 and 900 alike,
         against 391.123px for 600. All fourteen now say 700, which is what they were
         always drawing, so the stylesheets finally describe what is on screen.
         To genuinely use 800: add ";800" below AND change the rules that want it,
         and expect the look to change in fourteen places. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
