<!doctype html>
<meta charset="utf-8" />
<title>track switch repro</title>
<body style="font:12px/1.45 ui-monospace,monospace;background:#0b1a3a;color:#dbe6ff;padding:20px">
  <p style="font-family:system-ui">Reproduces Gabe's report of 8/19: real library MP3s, real
     engine, a track switch mid-playback (the same call the in-session music menu makes).
     Prints the sample-by-sample timeline across the switch, which is the one thing his
     report could not show.</p>
  <button id="go" style="font:14px system-ui;padding:10px 18px;border-radius:8px">Run</button>
  <pre id="out" style="white-space:pre"></pre>
  <script type="module">
    import { MusicEngine } from '/src/focus/music.ts';
    import { installAudioDoctor } from '/src/focus/audiodoctor.ts';
    import { armAudioContext } from '/src/focus/timer.ts';
    import { LIBRARY_TRACKS } from '/src/focus/library.ts';

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const PEAK_HEADROOM_DB = 0.5;
    // The same mapping focus/view.ts libraryToTrack does, so the gains are the real ones.
    const toTrack = (lt) => {
      const wanted = Math.pow(10, lt.gainDb / 20);
      const headroom = lt.peakDb == null ? Infinity : Math.pow(10, (-PEAK_HEADROOM_DB - lt.peakDb) / 20);
      return { key: lt.id, label: lt.title, emoji: lt.emoji, src: lt.src, volume: 100, gain: Math.min(wanted, headroom) };
    };

    document.getElementById('go').addEventListener('click', async () => {
      const out = document.getElementById('out');
      const log = (s) => { out.textContent += s + '\n'; };
      out.textContent = '';
      installAudioDoctor();
      const D = window.__audioDoctor;
      armAudioContext();
      await wait(150);

      const a = toTrack(LIBRARY_TRACKS[0]);
      const b = toTrack(LIBRARY_TRACKS[1]);
      log(`A = ${a.label}  gain ${a.gain.toFixed(3)}`);
      log(`B = ${b.label}  gain ${b.gain.toFixed(3)}`);

      const e = new MusicEngine();
      e.setVolume(60); // roughly where Gabe's report sat (gain 0.309 at steady state)
      e.setPlaylist([a], 0, true);
      await wait(6000); // past the 2.5s opening fade, fully settled
      log(`\nbefore switch: playing=${!e['audio'].paused} t=${e['audio'].currentTime.toFixed(2)}`);

      log(D.start());
      await wait(2000);
      const tSwitch = performance.now();
      // EXACTLY what the in-session music menu does (focus/view.ts selectCollection).
      e.setPlaylist([b], 0, true);
      e.setVolume(60);
      log('--- switched to B ---');
      await wait(14000);
      const rep = D.report();
      D.stop();
      const raw = window.__audioDoctorRaw;

      log('\n' + rep);
      log('\nTIMELINE ACROSS THE SWITCH (every sample):');
      log('    t(s)   cur   ready  buf     preDb    postDb   gain    fade');
      for (const s of raw.samples) {
        if (s.t < 1500) continue;
        log(`  ${(s.t / 1000).toFixed(1).padStart(5)}  ${String(s.cur).padStart(6)}  ${String(s.ready).padStart(3)}  ${String(s.buf).padStart(7)}  ${String(s.preDb).padStart(7)}  ${String(s.postDb).padStart(8)}  ${String(s.gain).padStart(6)}  ${String(s.fade).padStart(5)}`);
      }
      window.__switch = { report: rep, samples: raw.samples, events: raw.events };
      e.destroy();
    });
  </script>
</body>
